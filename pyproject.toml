[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakejanitor"
version = "0.1.0"
description = "A read only health check for Apache Iceberg tables that scores tables from metadata and prints a dry run maintenance plan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]
pyiceberg = [
    "pyiceberg>=0.7",
]

[project.scripts]
lakejanitor = "lakejanitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
